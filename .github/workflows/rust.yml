name: Rust CI

on:
  push:
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/coverage-summary.mjs'
      - '.github/workflows/rust.yml'
    branches: [main]
  pull_request:
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/coverage-summary.mjs'
      - '.github/workflows/rust.yml'
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Coverage and regular builds must not coexist on the hosted runner.
          # Keep registry caches, but avoid restoring two large target trees.
          cache-targets: false

      - name: Build frontend
        working-directory: frontend-panel
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build
        run: cargo build --verbose

      - name: Format check
        run: cargo fmt -- --check

      - name: Prepare coverage output directory
        run: mkdir -p coverage/rust

      - name: Run tests
        run: cargo test --workspace --no-fail-fast

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Free build space before coverage
        run: cargo clean

      - name: Run library tests with coverage
        run: cargo llvm-cov --workspace --lib --no-fail-fast --lcov --output-path coverage/rust/lcov.info

      - name: Generate HTML coverage report
        if: success()
        run: cargo llvm-cov report --html --output-dir coverage/rust/html

      - name: Publish coverage summary
        if: always() && hashFiles('coverage/rust/lcov.info') != ''
        run: bun scripts/coverage-summary.mjs "Rust" coverage/rust/lcov.info

      - name: Upload coverage reports to Codecov
        if: always() && env.CODECOV_TOKEN != '' && hashFiles('coverage/rust/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage/rust/lcov.info
          flags: rust
          name: rust-backend
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          if-no-files-found: ignore
          path: coverage/rust

  integration-backends:
    name: Integration tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, mysql]
    env:
      ASTER_TEST_DATABASE_BACKEND: ${{ matrix.backend }}
      # 复用 testcontainers 容器，测试间共享 Postgres/MySQL 实例
      TESTCONTAINERS_REUSE_ENABLED: "true"
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: integration-${{ matrix.backend }}
          shared-key: integration

      - name: Build frontend
        working-directory: frontend-panel
        run: |
          bun install --frozen-lockfile
          bun run build

      # testcontainers 使用的 Docker 在 ubuntu-latest 上预装
      - name: Verify Docker availability
        run: docker version

      # The full SQLite suite runs in build. Exercise the database-specific
      # migration, seed-data and core API contract once for this backend.
      - name: Run integration tests against ${{ matrix.backend }}
        run: cargo test --test test_database_backends "test_${ASTER_TEST_DATABASE_BACKEND}_smoke_foundation_contracts" -- --exact
