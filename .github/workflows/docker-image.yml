name: Portal image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build native image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: CARGO_FEATURES=server,cli
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=portal-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=portal-${{ matrix.arch }}
      - name: Start exact image and check readiness
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run -d --name portal "$IMAGE@$DIGEST"
          for attempt in {1..30}; do
            if docker exec portal wget -qO /dev/null http://127.0.0.1:3000/health/ready; then
              mkdir -p digests
              touch "digests/${DIGEST#sha256:}"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    needs: image
    runs-on: ubuntu-24.04
    concurrency:
      group: portal-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Publish multi-platform manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(-t "$image:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags+=(-t "$image:$GITHUB_REF_NAME")
          elif [[ "$GITHUB_REF" == refs/heads/main && "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]; then
            tags+=(-t "$image:latest")
          fi
          sources=()
          for digest in digests/*; do sources+=("$image@sha256:${digest##*/}"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA"
