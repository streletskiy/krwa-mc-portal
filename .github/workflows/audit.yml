name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.cargo/audit.toml'
      - 'frontend-panel/package.json'
      - 'frontend-panel/bun.lock'
      - 'docs/package.json'
      - 'docs/bun.lock'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.cargo/audit.toml'
      - 'frontend-panel/package.json'
      - 'frontend-panel/bun.lock'
      - 'docs/package.json'
      - 'docs/bun.lock'
      - '.github/workflows/audit.yml'
  schedule:
    # 每周一 09:17 UTC（北京时间 17:17）
    - cron: '17 9 * * 1'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read

jobs:
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: frontend-panel
        run: bun install --frozen-lockfile

      - name: Run audit
        working-directory: frontend-panel
        run: bun audit --audit-level=high

  docs-audit:
    name: Documentation dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Run audit
        working-directory: docs
        run: bun audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
